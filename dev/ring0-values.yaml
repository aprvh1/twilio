commonLabels:
  demo-mode: "true"
image:
  registry: "docker.io"
  tag: "stable-alpine3.23-perl"
  repository: "nginx"
replicaCount: 1
service:
  type: "ClusterIP"
  ports:
    http: 80
# Inside dev/ring0/values.yaml
containerSecurityContext:
  readOnlyRootFilesystem: false # NGINX needs to write to /tmp

nginx:
  # This overwrites the default nginx.conf with non-root friendly paths
  customConfig: |
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;
        server {
            listen 8080;
            location / {
                root /usr/share/nginx/html;
            }
        }
    }
